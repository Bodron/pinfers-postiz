# New vhost only. Does not replace your existing nginx.conf.
# certbot --nginx adds the HTTPS certificate after DNS points at this server.
server {
    listen 127.0.0.1:14007;
    server_name localhost;
    include /opt/pinfers-postiz/deploy/nginx-routes.conf;
}
server {
    listen 80;
    server_name pinferspostiz.bcmenu.ro;
    include /opt/pinfers-postiz/deploy/nginx-routes.conf;
}
