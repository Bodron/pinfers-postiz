client_max_body_size 1G;
location = /media {
    set $pinfers_media http://127.0.0.1:14011;
    if ($arg_native = 1) { set $pinfers_media http://127.0.0.1:14200; }
    proxy_pass $pinfers_media;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
}
location /pinfers/ {
    proxy_pass http://127.0.0.1:14011;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 180s;
}
location /api/ {
    proxy_pass http://127.0.0.1:13100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /uploads/ {
    alias /opt/pinfers-postiz/uploads/;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; frame-ancestors 'none'; sandbox" always;
}
location / {
    proxy_pass http://127.0.0.1:14200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    sub_filter '</body>' '<script src="/pinfers/nav.js"></script></body>';
    sub_filter_once on;
}
